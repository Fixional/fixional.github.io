<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Persona | Link-in-Bio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Orbitron for headers, Inter for body -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div id="splash-screen">
        <div class="splash-content">
            <h1 class="glitch-text" data-text="ENTER THE MATRIX">ENTER THE MATRIX</h1>
            <button id="enter-btn">CLICK TO START</button>
        </div>
    </div>
    <button id="crt-toggle" class="crt-btn">
        <i data-lucide="tv"></i>
        <span class="btn-text">CRT: OFF</span>
    </button>
    <div class="crt-overlay"></div>
    <div class="crt-vignette"></div>
    <div class="custom-cursor"></div>
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="assets/c74e243d-a451-4b67-9238-9b1d06656d57.mp4" type="video/mp4">
    </video>
    <audio id="bg-music" loop>
        <source src="assets/I really want to stay at your house short.m4a" type="audio/mp4">
    </audio>
    <div class="background-overlay"></div>
    <main class="container">
        <!-- Profile Section -->
        <header class="profile-section">
            <div class="profile-pic-container">
                <img src="assets/profile.jpg" alt="Profile Picture" class="profile-pic" id="profile-img">
                <div class="status-indicator"></div>
            </div>
            <h1 class="glitch-text" data-text="Coklatssss">Null</h1>
            <p class="subtitle">Missing / Gamer</p>
            <div class="tags">
                <span class="tag">Nihil</span>
                <span class="tag">Void</span>
            </div>
        </header>

        <!-- Social Media Section -->
        <section class="links-section">
            <h2 class="section-title">SOCIAL MEDIA</h2>
            <div class="links-grid">
                <a href="https://instagram.com/dffairfn" target="_blank" class="glass-card link-card">
                    <img src="assets/instagram.svg" alt="Instagram" class="link-icon">
                    <div class="card-text">
                        <h3>Instagram</h3>
                        <p>@dffairfn</p>
                    </div>
                </a>
                <a href="https://github.com/Fixional" target="_blank" class="glass-card link-card">
                    <img src="assets/github.svg" alt="Github" class="link-icon">
                    <div class="card-text">
                        <h3>Github</h3>
                        <p>Fixional</p>
                    </div>
                </a>
                <a href="https://steamcommunity.com/id/Null1407" target="_blank" class="glass-card link-card">
                    <img src="assets/steam.svg" alt="Steam" class="link-icon">
                    <div class="card-text">
                        <h3>Steam</h3>
                        <p>Fixion</p>
                    </div>
                </a>
                <a href="https://discord.com/users/563738816255361045" target="_blank" class="glass-card link-card">
                    <img src="assets/discord.svg" alt="Discord" class="link-icon">
                    <div class="card-text">
                        <h3>Discord</h3>
                        <p>Fixion</p>
                    </div>
                </a>
            </div>
        </section>

        <!-- Support Me Section -->
        <section class="support-section">
            <h2 class="section-title">SUPPORT ME</h2>
            <a href="#" class="glass-card support-card">
                <i data-lucide="heart" class="heart-icon"></i>
                <div class="card-text">
                    <h3>Saweria</h3>
                    <p>Buat jajan kopi</p>
                </div>
            </a>
        </section>

        <!-- Music Player Component -->
        <footer class="music-player glass-card">
            <div class="track-info">
                <div class="track-art">
                    <i data-lucide="music"></i>
                </div>
                <div class="track-details">
                    <span class="track-name">I Really Want to Stay at Your House</span>
                    <span class="track-artist">Rosa Walton & Hallie Coggins</span>
                </div>
            </div>
            <div class="player-controls">
                <div class="progress-container">
                    <span class="current-time">0:00</span>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <span class="total-duration">3:45</span>
                </div>
                <div class="control-buttons">
                    <button class="control-btn"><i data-lucide="skip-back"></i></button>
                    <button class="control-btn play-btn"><i data-lucide="play"></i></button>
                    <button class="control-btn"><i data-lucide="skip-forward"></i></button>
                </div>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
